<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: scribble-audio:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Scribble</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="titlebar"></div>
    <aside id="sidebar"></aside>
    <main>
      <header id="header"></header>
      <div id="content"></div>
    </main>
    <div id="record-bar" hidden></div>
    <div id="toast" role="status" hidden></div>
    <dialog id="modal"></dialog>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/form-translations.js"></script>
    <script src="app.js"></script>
  </body>
</html>
